type: object
properties:
  url:
    $ref: '#/components/schemas/ResourceID'
    description: On update, the existing item to update or remove, or an empty string to add one - FreeAgent rejects an item without it
  _destroy:
    type: integer
    description: Set to 1, with url, to remove the item
    example: 1
  category:
    $ref: '#/components/schemas/ResourceID'
  description:
    type: string
    example: Item description
  total_value:
    type: string
    description: Value including sales tax
    example: '300.0'
  sales_tax_rate:
    type: string
    description: Defaults to the standard rate
    example: '20.0'
