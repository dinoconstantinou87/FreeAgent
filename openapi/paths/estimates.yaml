list:
  get:
    tags:
    - Estimates
    summary: List estimates
    description: List estimates
    operationId: listEstimates
    parameters:
    - name: nested_estimate_items
      in: query
      description: Include estimate items in each estimate
      schema:
        type: boolean
        example: true
    - name: contact
      in: query
      description: Filter estimates by contact
      schema:
        $ref: '#/components/schemas/ResourceID'
    - name: project
      in: query
      description: Filter estimates by project
      schema:
        $ref: '#/components/schemas/ResourceID'
    - name: invoice
      in: query
      description: Filter estimates by the invoice they were converted to
      schema:
        $ref: '#/components/schemas/ResourceID'
    - name: view
      in: query
      description: Filter estimates by view - FreeAgent returns no estimates for an unknown view rather than an error
      schema:
        type: string
        enum:
        - all
        - recent
        - draft
        - non_draft
        - sent
        - approved
        - rejected
        - invoiced
        example: all
    - name: from_date
      in: query
      description: Show estimates dated on or after this date (YYYY-MM-DD)
      schema:
        type: string
        example: 2026-01-01
    - name: to_date
      in: query
      description: Show estimates dated on or before this date (YYYY-MM-DD)
      schema:
        type: string
        example: 2026-12-31
    - name: updated_since
      in: query
      description: Show estimates updated since this timestamp
      schema:
        type: string
        example: 2026-01-01T00:00:00Z
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Success
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Total-Count:
            $ref: '#/components/headers/XTotalCount'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  post:
    tags:
    - Estimates
    summary: Create estimate
    description: Create estimate
    operationId: createEstimate
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
            - estimate
            properties:
              estimate:
                $ref: '#/components/schemas/EstimateCreatePayload'
          examples:
            Create Estimate:
              value:
                estimate:
                  contact: https://api.freeagent.com/v2/contacts/:id
                  dated_on: 2026-10-02
                  estimate_type: Estimate
                  status: Draft
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
show:
  get:
    tags:
    - Estimates
    summary: Show estimate
    description: Show estimate
    operationId: showEstimate
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  put:
    tags:
    - Estimates
    summary: Update estimate
    description: Update estimate
    operationId: updateEstimate
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
            - estimate
            properties:
              estimate:
                $ref: '#/components/schemas/EstimateUpdatePayload'
          examples:
            Update Estimate:
              value:
                estimate:
                  notes: Valid for 30 days
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  delete:
    tags:
    - Estimates
    summary: Delete estimate
    description: Delete estimate - only a Draft estimate can be deleted, anything else is a 409 with no body
    operationId: deleteEstimate
    responses:
      '200':
        description: Success
      default:
        $ref: '#/components/responses/ErrorResponse'
  parameters:
  - $ref: '#/components/parameters/Id'
