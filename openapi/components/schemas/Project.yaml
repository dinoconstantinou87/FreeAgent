type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  name:
    type: string
    example: Website Development
  contact:
    type: string
    description: The contact billed for the project - an invoice for the project must use this contact
    example: https://api.freeagent.com/v2/contacts/1
  contact_name:
    type: string
    example: Acme Ltd
  status:
    $ref: '#/components/schemas/ProjectStatus'
  contract_po_reference:
    type: string
    description: Omitted until set
    example: PO-001
  uses_project_invoice_sequence:
    type: boolean
    example: false
  currency:
    type: string
    example: GBP
  budget:
    type: integer
    description: Zero when the project has no budget - FreeAgent drops any fraction sent
    example: 0
  budget_units:
    $ref: '#/components/schemas/ProjectBudgetUnits'
  hours_per_day:
    type: string
    example: '8.0'
  normal_billing_rate:
    type: string
    description: Rounded to two decimal places
    example: '0.0'
  billing_period:
    $ref: '#/components/schemas/BillingPeriod'
  is_ir35:
    type: boolean
    description: Omitted until set
    example: false
  starts_on:
    type: string
    description: Omitted until set
    example: '2026-01-01'
  ends_on:
    type: string
    description: Omitted until set
    example: '2026-12-31'
  include_unbilled_time_in_profitability:
    type: boolean
    example: true
  is_deletable:
    type: boolean
    description: Sent on show, create and update, never in a list - false once tasks, timeslips, invoices, credit notes, estimates, expenses, bills or rebilled bank explanations use the project
    example: false
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T08:56:21.000Z'
  updated_at:
    type: string
    format: date-time
    example: '2025-09-10T09:35:43.000Z'
