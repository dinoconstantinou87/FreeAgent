type: object
required:
- email
- first_name
- last_name
- role
properties:
  email:
    type: string
    description: An invalid or taken address is a 422
    example: jane@example.com
  first_name:
    type: string
    example: Jane
  last_name:
    type: string
    example: Smith
  role:
    $ref: '#/components/schemas/UserRole'
  permission_level:
    $ref: '#/components/schemas/UserPermissionLevel'
  ni_number:
    type: string
    description: A UK National Insurance number, validated by FreeAgent
    example: AB123456C
  unique_tax_reference:
    type: string
    description: Ten digits without spaces
    example: '1234567890'
  opening_mileage:
    type: number
    description: Documented as required, but defaults to 0
    example: 0
  hidden:
    type: boolean
    example: false
  send_invitation:
    type: boolean
    description: True to email the user an invitation to set their password
    example: false
