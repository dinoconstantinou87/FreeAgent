type: object
required:
- user
- task
- dated_on
properties:
  user:
    $ref: '#/components/schemas/ResourceID'
  project:
    $ref: '#/components/schemas/ResourceID'
    description: Documented as required, but FreeAgent always uses the task's project and ignores this
  task:
    $ref: '#/components/schemas/ResourceID'
  dated_on:
    type: string
    example: '2026-10-02'
  hours:
    type: number
    description: Defaults to 0. A negative value is a 422
    example: 1.5
  comment:
    type: string
    example: Wrote the timeslip commands
