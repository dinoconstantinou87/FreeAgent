type: object
properties:
  body:
    type: string
    example: Bison bison bison bison bison Bison bison
  from:
    type: string
    example: Our Company <us@company.com>
  subject:
    type: string
    example: Testing
  to:
    type: string
    example: test_contact@example.com
  attachments:
    type: array
    description: Files of up to 5MB each
    items:
      $ref: '#/components/schemas/EmailAttachmentPayload'
