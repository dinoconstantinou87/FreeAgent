type: object
description: An empty string removes a text field, but a contact with no organisation name must keep its first and last name
properties:
  organisation_name:
    type: string
    example: Testington & Sons Ltd
  first_name:
    type: string
    example: Frederick
  last_name:
    type: string
    example: Testington
  email:
    type: string
    description: Several addresses can be separated by commas - an empty string removes them
    example: fred@testingtonandsons.example.com
  billing_email:
    type: string
    example: billing@testingtonandsons.example.com
  phone_number:
    type: string
    example: '12345678'
  mobile:
    type: string
    example: '9876543210'
  address1:
    type: string
    example: 11 George Street
  address2:
    type: string
    example: South Court
  address3:
    type: string
    example: Flat 6
  town:
    type: string
    example: London
  region:
    type: string
    example: Southwark
  postcode:
    type: string
    example: SE1 6HA
  country:
    type: string
    example: United Kingdom
  contact_name_on_invoices:
    type: boolean
    example: true
  default_payment_terms_in_days:
    type: integer
    description: Must be zero or more
    example: 30
  locale:
    $ref: '#/components/schemas/ContactLocale'
  charge_sales_tax:
    $ref: '#/components/schemas/ContactChargeSalesTax'
  sales_tax_registration_number:
    type: string
    example: GB123456789
  uses_contact_invoice_sequence:
    type: boolean
    example: false
  status:
    $ref: '#/components/schemas/ContactStatus'
