type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/expenses/1
  user:
    type: string
    example: https://api.freeagent.com/v2/users/1
  category:
    type: string
    example: https://api.freeagent.com/v2/categories/285
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  property:
    type: string
    example: https://api.freeagent.com/v2/properties/1
  dated_on:
    type: string
    example: 2025-08-23
  description:
    type: string
    example: Team lunch
  currency:
    type: string
    example: GBP
  gross_value:
    type: string
    example: '-12.0'
  native_gross_value:
    type: string
    example: '-12.0'
  sales_tax_rate:
    type: string
    example: '20.0'
  sales_tax_value:
    type: string
    example: '-2.0'
  sales_tax_status:
    type: string
    example: TAXABLE
  native_sales_tax_value:
    type: string
    example: '-2.0'
  second_sales_tax_rate:
    type: string
    example: '0.0'
  second_sales_tax_status:
    type: string
    example: TAXABLE
  manual_sales_tax_amount:
    type: string
    example: '0.12'
  ec_status:
    type: string
    example: UK/Non-EC
  receipt_reference:
    type: string
    example: REC-001
  attachment:
    $ref: 'Attachment.yaml'
  stock_item:
    type: string
    example: https://api.freeagent.com/v2/stock_items/1
  stock_item_description:
    type: string
    example: Widget
  stock_altering_quantity:
    type: string
    example: '2.0'
  rebill_type:
    type: string
    example: markup
  rebill_factor:
    type: string
    example: '0.25'
  rebill_to_project:
    type: string
    example: https://api.freeagent.com/v2/projects/2
  rebilled_on_invoice:
    type: string
    example: https://api.freeagent.com/v2/invoices/1
  recurring:
    type: string
    example: Monthly
  next_recurs_on:
    type: string
    example: 2025-09-23
  recurring_end_date:
    type: string
    example: 2026-08-23
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T06:48:35Z'
  updated_at:
    type: string
    format: date-time
    example: '2026-09-20T09:30:32Z'
