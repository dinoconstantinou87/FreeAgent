type: object
description: Fields left out are kept - an empty ni_number or unique_tax_reference removes it
properties:
  email:
    type: string
    description: An invalid or taken address is a 422
    example: jane@example.com
  first_name:
    type: string
    example: Jane
  last_name:
    type: string
    example: Smith
  role:
    $ref: '#/components/schemas/UserRole'
  permission_level:
    $ref: '#/components/schemas/UserPermissionLevel'
  ni_number:
    type: string
    description: A UK National Insurance number, validated by FreeAgent
    example: AB123456C
  unique_tax_reference:
    type: string
    description: Ten digits without spaces
    example: '1234567890'
  opening_mileage:
    type: number
    example: 0
  hidden:
    type: boolean
    example: false
