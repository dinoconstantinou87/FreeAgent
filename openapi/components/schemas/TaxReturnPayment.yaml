type: object
properties:
  label:
    type: string
    example: Payment Due
  due_on:
    type: string
    example: '2025-12-07'
  amount_due:
    description: Negative for a refund. VAT sends the number 0 on a No Payment Due payment; every other amount, zero included, is a decimal string
    oneOf:
    - type: string
    - type: number
    example: '413.06'
  status:
    type: string
    description: One of unpaid or marked_as_paid, omitted when nothing is due
    example: unpaid
