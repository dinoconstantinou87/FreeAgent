type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/journal_sets/1
  dated_on:
    type: string
    description: Absent on the opening balances set
    example: '2026-09-30'
  description:
    type: string
    example: Director's capital introduced
  tag:
    type: string
    description: Omitted until set - tagged sets are read-only in the FreeAgent app
    example: MYAPPTAG
  journal_entries:
    type: array
    items:
      $ref: '#/components/schemas/JournalEntry'
  bank_accounts:
    type: array
    description: Opening balances set only
    items:
      $ref: '#/components/schemas/OpeningBalance'
  stock_items:
    type: array
    description: Opening balances set only
    items:
      $ref: '#/components/schemas/OpeningBalance'
  updated_at:
    type: string
    format: date-time
    example: '2026-10-03T08:33:30.000Z'
