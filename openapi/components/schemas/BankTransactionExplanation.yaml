type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/bank_transaction_explanations/1
  bank_account:
    type: string
    example: https://api.freeagent.com/v2/bank_accounts/1
  bank_transaction:
    type: string
    example: https://api.freeagent.com/v2/bank_transactions/8
  category:
    type: string
    example: https://api.freeagent.com/v2/categories/285
  dated_on:
    type: string
    example: 2010-05-01
  description:
    type: string
    example: harness end-to-end e-business
  gross_value:
    type: string
    example: '-730.0'
  sales_tax_rate:
    type: string
    example: '0.0'
  sales_tax_value:
    type: string
    example: '0.0'
  sales_tax_status:
    type: string
    example: TAXABLE
  manual_sales_tax_amount:
    type: string
    example: '0.0'
  paid_bill:
    type: string
    example: https://api.freeagent.com/v2/bills/123
  paid_invoice:
    type: string
    example: https://api.freeagent.com/v2/invoices/123
  paid_user:
    type: string
    example: https://api.freeagent.com/v2/users/1
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  marked_for_review:
    type: boolean
    example: false
  is_money_in:
    type: boolean
    example: false
  is_money_out:
    type: boolean
    example: true
  is_deletable:
    type: boolean
    example: true
  is_locked:
    type: boolean
    example: false
  updated_at:
    type: string
    format: date-time
