list:
  get:
    tags:
    - Invoices
    summary: List Invoices
    description: List Invoices
    operationId: listInvoices
    parameters:
    - name: nested_invoice_items
      in: query
      description: Include nested invoice items in response
      schema:
        type: boolean
        example: true
    - name: contact
      in: query
      description: Filter invoices by contact
      schema:
        $ref: '#/components/schemas/ResourceID'
    - name: project
      in: query
      description: Filter invoices by project
      schema:
        $ref: '#/components/schemas/ResourceID'
    - name: currency
      in: query
      description: Filter invoices by currency code
      schema:
        $ref: '#/components/schemas/Currency'
    - name: view
      in: query
      description: Filter invoices by view type
      schema:
        $ref: '#/components/schemas/InvoiceView'
    - name: updated_since
      in: query
      description: Show invoices updated since this date (YYYY-MM-DD)
      schema:
        type: string
        example: 2018-01-01
    - name: sort
      in: query
      description: Sort invoices by specified field
      schema:
        type: string
        enum:
        - updated_at
        - created_at
        example: updated_at
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Success
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Total-Count:
            $ref: '#/components/headers/XTotalCount'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  post:
    tags:
    - Invoices
    summary: Create Invoice
    description: Create Invoice
    operationId: createInvoice
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              invoice:
                $ref: '#/components/schemas/InvoiceCreatePayload'
          examples:
            Create Invoice:
              value:
                invoice:
                  always_show_bic_and_iban: false
                  contact: https://api.freeagent.com/v2/contacts/:id
                  currency: GBP
                  dated_on: 2019-08-18
                  due_on: 2019-09-18
                  omit_header: false
                  payment_terms_in_days: 30
            Bill Project Timeslips:
              value:
                invoice:
                  contact: https://api.freeagent.com/v2/contacts/:id
                  project: https://api.freeagent.com/v2/projects/:id
                  dated_on: 2026-10-02
                  payment_terms_in_days: 30
                  include_timeslips: billed_grouped_by_timeslip
            Bill Project Expenses:
              value:
                invoice:
                  contact: https://api.freeagent.com/v2/contacts/:id
                  project: https://api.freeagent.com/v2/projects/:id
                  dated_on: 2026-10-02
                  payment_terms_in_days: 30
                  include_expenses: billed_grouped_by_expense
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
