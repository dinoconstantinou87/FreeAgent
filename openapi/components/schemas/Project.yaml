type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  name:
    type: string
    example: Website Development
  contact:
    type: string
    description: The contact billed for the project - an invoice for the project must use this contact
    example: https://api.freeagent.com/v2/contacts/1
  contact_name:
    type: string
    example: Acme Ltd
  status:
    type: string
    description: One of Active, Completed, Cancelled or Hidden
    example: Active
  contract_po_reference:
    type: string
    example: PO-001
  uses_project_invoice_sequence:
    type: boolean
    example: false
  currency:
    type: string
    example: GBP
  budget:
    type: number
    description: Zero when the project has no budget
    example: 0
  budget_units:
    type: string
    description: One of Hours, Days or Monetary
    example: Monetary
  hours_per_day:
    type: string
    example: '8.0'
  normal_billing_rate:
    type: string
    example: '0.0'
  billing_period:
    type: string
    description: One of hour or day, the unit of normal_billing_rate
    example: hour
  is_ir35:
    type: boolean
    example: false
  starts_on:
    type: string
    example: '2026-01-01'
  ends_on:
    type: string
    example: '2026-12-31'
  include_unbilled_time_in_profitability:
    type: boolean
    example: true
  is_deletable:
    type: boolean
    description: Only sent when showing a single project
    example: false
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T08:56:21.000Z'
  updated_at:
    type: string
    format: date-time
    example: '2025-09-10T09:35:43.000Z'
