list:
  get:
    tags:
    - Corporation Tax Returns
    summary: List corporation tax returns
    description: List corporation tax returns
    operationId: listCorporationTaxReturns
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporationTaxReturnListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
show:
  get:
    tags:
    - Corporation Tax Returns
    summary: Show corporation tax return
    description: Show corporation tax return
    operationId: showCorporationTaxReturn
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporationTaxReturnResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  parameters:
  - $ref: '#/components/parameters/PeriodEndsOn'
