type: object
required:
- from
- to
- value
properties:
  from:
    type: string
    example: 2025-09-01
  to:
    type: string
    example: 2099-12-31
  value:
    type: object
    description: Each engine type valid in the period, with its engine sizes
    additionalProperties:
      type: array
      items:
        type: string
    example:
      Petrol:
      - Up to 1400cc
      - 1401-2000cc
      - Over 2000cc
