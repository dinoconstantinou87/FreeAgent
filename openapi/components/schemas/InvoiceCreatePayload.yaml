type: object
properties:
  always_show_bic_and_iban:
    type: boolean
    example: false
  contact:
    $ref: '#/components/schemas/ResourceID'
  project:
    $ref: '#/components/schemas/ResourceID'
    description: Must belong to the contact, or the create is a 422
  include_timeslips:
    type: string
    description: Bills every unbilled timeslip on the project onto the invoice, grouped as named - without a project nothing is billed
    enum:
    - billed_grouped_by_single_timeslip
    - billed_grouped_by_timeslip
    - billed_grouped_by_timeslip_task
    - billed_grouped_by_timeslip_date
    example: billed_grouped_by_timeslip
  include_expenses:
    type: string
    description: Bills every unbilled expense, bill and bank account entry rebilled to the project onto the invoice, on one line or one per expense - without a project nothing is billed
    enum:
    - billed_grouped_by_single_expense
    - billed_grouped_by_expense
    example: billed_grouped_by_expense
  currency:
    $ref: '#/components/schemas/Currency'
    description: The retired codes are refused, and SSP and VES are a 500 that creates nothing
  dated_on:
    type: string
    example: 2019-08-18
  due_on:
    type: string
    example: 2019-09-18
  omit_header:
    type: boolean
    example: false
  payment_terms_in_days:
    type: number
    example: 30
