type: object
required:
- email
- first_name
- last_name
- role
properties:
  email:
    type: string
    description: An invalid or taken address is a 422
    example: jane@example.com
  first_name:
    type: string
    example: Jane
  last_name:
    type: string
    example: Smith
  role:
    $ref: '#/components/schemas/UserRole'
  permission_level:
    type: integer
    description: 0 No Access, 1 Time, 2 My Money, 3 Contacts & Projects, 4 Invoices, Estimates & Files, 5 Bills, 6 Banking, 7 Tax, Accounting & Users, 8 Full - defaults to 0, and FreeAgent turns anything above 8 into 8
    minimum: 0
    maximum: 8
    example: 1
  ni_number:
    type: string
    description: A UK National Insurance number, validated by FreeAgent
    example: AB123456C
  unique_tax_reference:
    type: string
    description: Ten digits without spaces
    example: '1234567890'
  opening_mileage:
    type: number
    description: Documented as required, but defaults to 0
    example: 0
  hidden:
    type: boolean
    example: false
  send_invitation:
    type: boolean
    description: True to email the user an invitation to set their password
    example: false
