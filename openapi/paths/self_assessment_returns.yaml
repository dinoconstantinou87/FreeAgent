list:
  get:
    tags:
    - Self Assessment Returns
    summary: List self assessment returns
    description: List self assessment returns
    operationId: listSelfAssessmentReturns
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfAssessmentReturnListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  parameters:
  - $ref: '#/components/parameters/UserId'
