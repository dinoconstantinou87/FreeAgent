list:
  get:
    tags:
    - Contacts
    summary: List Contacts
    description: List Contacts
    operationId: listContacts
    parameters:
    - name: view
      in: query
      description: Filter contacts by view - active is the default and leaves out hidden contacts, and FreeAgent answers an unknown view with a 400
      schema:
        type: string
        enum:
        - all
        - active
        - clients
        - suppliers
        - active_projects
        - completed_projects
        - open_clients
        - open_suppliers
        - hidden
        example: open_clients
    - name: sort
      in: query
      description: Sort contacts by specified field, descending with a leading hyphen - name sorts by organisation name, then last name, then first name
      schema:
        type: string
        enum:
        - name
        - -name
        - created_at
        - -created_at
        - updated_at
        - -updated_at
        example: -updated_at
    - name: updated_since
      in: query
      description: Show contacts updated since this timestamp - FreeAgent answers an invalid timestamp with a 400
      schema:
        type: string
        example: 2026-01-01T00:00:00Z
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Success
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Total-Count:
            $ref: '#/components/headers/XTotalCount'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  post:
    tags:
    - Contacts
    summary: Create Contact
    description: Create Contact - it needs an organisation name, or a first and last name
    operationId: createContact
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
            - contact
            properties:
              contact:
                $ref: '#/components/schemas/ContactCreatePayload'
          examples:
            Create Contact:
              value:
                contact:
                  organisation_name: Testington & Sons Ltd
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
show:
  get:
    tags:
    - Contacts
    summary: Show Contact
    description: Show Contact
    operationId: showContact
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  put:
    tags:
    - Contacts
    summary: Update Contact
    description: Update Contact - fields left out are kept, and an empty contact is a 400
    operationId: updateContact
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
            - contact
            properties:
              contact:
                $ref: '#/components/schemas/ContactUpdatePayload'
          examples:
            Hide Contact:
              value:
                contact:
                  status: Hidden
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  delete:
    tags:
    - Contacts
    summary: Delete Contact
    description: Delete Contact - a contact used by invoices, credit notes, bills, estimates or projects is a 403 whose message names the first kind found, and can be hidden instead
    operationId: deleteContact
    responses:
      '200':
        description: Success
      default:
        $ref: '#/components/responses/ErrorResponse'
  parameters:
  - $ref: '#/components/parameters/Id'
