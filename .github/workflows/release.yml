name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Lint
        run: |
          swiftformat --lint .
          swiftlint lint Sources

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          {
            echo "version=${NEW_VERSION}"
            echo "tag=v${NEW_VERSION}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: prepare
    uses: ./.github/workflows/universal-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      upload: true

  linux:
    name: Linux
    needs: prepare
    uses: ./.github/workflows/static-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      upload: true

  publish:
    name: Publish
    needs: [prepare, macos, linux]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes \
            freeagent-"${TAG}"-*.tar.gz \
            freeagent-"${TAG}"-*.tar.gz.sha256

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          SHA256=$(cat "freeagent-${TAG}-macos-universal.tar.gz.sha256" | awk '{print $1}')
          TARBALL_URL="https://github.com/dinoconstantinou87/FreeAgent/releases/download/${TAG}/freeagent-${TAG}-macos-universal.tar.gz"

          git clone https://x-access-token:${GH_TOKEN}@github.com/dinoconstantinou87/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          cat > Formula/freeagent.rb <<FORMULA
          class Freeagent < Formula
            desc "Command-line interface for the FreeAgent accounting API"
            homepage "https://github.com/dinoconstantinou87/FreeAgent"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on :macos

            def install
              bin.install "freeagent"
              generate_completions_from_executable(bin/"freeagent", shell_parameter_format: :cobra, shells: [:bash, :zsh, :fish])
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/freeagent --version")
            end
          end
          FORMULA
          sed -i '' 's/^          //' Formula/freeagent.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "update-freeagent-${VERSION}"
          git add Formula/freeagent.rb
          git commit -m "Update freeagent to ${VERSION}"
          git push origin "update-freeagent-${VERSION}"

          gh pr create \
            --repo dinoconstantinou87/homebrew-tap \
            --title "Update freeagent to ${VERSION}" \
            --body "Automated update from [FreeAgent release ${TAG}](https://github.com/dinoconstantinou87/FreeAgent/releases/tag/${TAG})" \
            --base main \
            --head "update-freeagent-${VERSION}"
