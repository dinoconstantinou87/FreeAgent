type: object
required:
- contact
- reference
- dated_on
- due_on
properties:
  contact:
    $ref: '#/components/schemas/ResourceID'
  reference:
    type: string
    example: REF100
  dated_on:
    type: string
    example: 2020-09-14
  due_on:
    type: string
    example: 2020-10-14
  comments:
    type: string
    example: Vehicle purchase
  project:
    $ref: '#/components/schemas/ResourceID'
  recurring:
    $ref: '#/components/schemas/BillRecurringPeriod'
  recurring_end_date:
    type: string
    example: 2028-10-02
  ec_status:
    type: string
    example: UK
  attachment:
    $ref: '#/components/schemas/AttachmentPayload'
  bill_items:
    type: array
    items:
      $ref: '#/components/schemas/BillItemPayload'
