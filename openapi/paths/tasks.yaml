list:
  get:
    tags:
    - Tasks
    summary: List tasks
    description: List tasks
    operationId: listTasks
    parameters:
    - name: project
      in: query
      description: Filter tasks by project URL - an unknown project is a 404
      schema:
        type: string
        example: https://api.freeagent.com/v2/projects/:id
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Success
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Total-Count:
            $ref: '#/components/headers/XTotalCount'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
