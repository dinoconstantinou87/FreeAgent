type: object
properties:
  user:
    $ref: '#/components/schemas/ResourceID'
  task:
    $ref: '#/components/schemas/ResourceID'
  dated_on:
    type: string
    example: '2026-10-02'
  hours:
    type: number
    description: Lost when a running timer stops, which sets the hours the timer started with plus the time it ran
    example: 1.5
  comment:
    type: string
    description: An empty string removes the comment
    example: Wrote the timeslip commands
