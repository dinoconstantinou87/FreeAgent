type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/tasks/1
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  name:
    type: string
    example: Development
  currency:
    type: string
    description: Always the project's currency
    example: GBP
  is_billable:
    type: boolean
    example: true
  billing_rate:
    type: string
    description: Defaults to the project's normal billing rate - needs the Contacts & Projects permission
    example: '0.0'
  billing_period:
    $ref: '#/components/schemas/BillingPeriod'
  status:
    $ref: '#/components/schemas/TaskStatus'
  is_deletable:
    type: boolean
    description: False once a timeslip uses the task
    example: false
  created_at:
    type: string
    format: date-time
    example: '2025-09-10T09:35:43.000Z'
  updated_at:
    type: string
    format: date-time
    example: '2025-09-10T09:35:43.000Z'
