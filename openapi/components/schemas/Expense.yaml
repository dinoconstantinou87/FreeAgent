type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/expenses/1
  user:
    type: string
    example: https://api.freeagent.com/v2/users/1
  category:
    type: string
    example: https://api.freeagent.com/v2/categories/285
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  project_name:
    type: string
    description: Not documented - sent with project
    example: Website Development
  contact_name:
    type: string
    description: Not documented - the project's contact, sent with project
    example: Acme Ltd
  property:
    type: string
    example: https://api.freeagent.com/v2/properties/1
  dated_on:
    type: string
    example: 2025-08-23
  description:
    type: string
    example: Team lunch
  currency:
    type: string
    example: GBP
  gross_value:
    type: string
    example: '-12.0'
  native_gross_value:
    type: string
    example: '-12.0'
  sales_tax_rate:
    type: string
    example: '20.0'
  sales_tax_value:
    type: string
    example: '-2.0'
  sales_tax_status:
    type: string
    example: TAXABLE
  native_sales_tax_value:
    type: string
    example: '-2.0'
  second_sales_tax_rate:
    type: string
    example: '0.0'
  second_sales_tax_status:
    type: string
    example: TAXABLE
  manual_sales_tax_amount:
    type: string
    example: '0.12'
  ec_status:
    type: string
    example: UK/Non-EC
  receipt_reference:
    type: string
    example: REC-001
  attachment:
    $ref: 'Attachment.yaml'
  stock_item:
    type: string
    example: https://api.freeagent.com/v2/stock_items/1
  stock_item_description:
    type: string
    example: Widget
  stock_altering_quantity:
    type: string
    example: '2.0'
  rebill_type:
    type: string
    example: markup
  rebill_factor:
    type: string
    example: '0.25'
  rebill_to_project:
    type: string
    example: https://api.freeagent.com/v2/projects/2
  rebilled_on_invoice:
    type: string
    example: https://api.freeagent.com/v2/invoices/1
  rebilled_on_invoice_item:
    type: string
    description: Not documented - the invoice item's ID, though the URL path says invoices
    example: https://api.freeagent.com/v2/invoices/1390808
  locked_attributes:
    type: array
    description: Not documented - the fields a rebilled expense can no longer change
    items:
      type: string
    example:
    - dated_on
    - gross_value
  locked_reason:
    type: string
    description: Not documented - why some fields are locked and the expense can't be deleted
    example: Some parts of this expense are locked, and it can't be deleted, because it has been rebilled.
  recurring:
    type: string
    example: Monthly
  next_recurs_on:
    type: string
    example: 2025-09-23
  recurring_end_date:
    type: string
    example: 2026-08-23
  mileage:
    type: string
    example: '42.0'
  vehicle_type:
    type: string
    example: Car
  engine_type:
    type: string
    example: Diesel
  engine_size:
    type: string
    example: 1601-2000cc
  engine_type_index:
    type: integer
    description: Not documented
    example: 1
  engine_size_index:
    type: integer
    description: Not documented
    example: 1
  reclaim_mileage:
    type: string
    description: Documented as an integer, sent as a string
    example: '1'
  initial_rate_mileage:
    type: string
    example: '42.0'
  reclaim_mileage_rate:
    type: string
    example: '0.55'
  rebill_mileage_rate:
    type: string
    example: '0.55'
  have_vat_receipt:
    type: boolean
    example: true
  capital_asset:
    type: string
    example: https://api.freeagent.com/v2/capital_assets/1
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T06:48:35Z'
  updated_at:
    type: string
    format: date-time
    example: '2026-09-20T09:30:32Z'
