type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/bank_accounts/1
  type:
    type: string
    example: StandardBankAccount
  name:
    type: string
    example: Business Current Account
  bank_name:
    type: string
    example: Acme Bank
  bank_code:
    type: string
    example: generic
  currency:
    type: string
    example: GBP
  status:
    type: string
    example: active
  is_personal:
    type: boolean
    example: false
  is_primary:
    type: boolean
    example: true
  opening_balance:
    type: string
    example: '0.0'
  current_balance:
    type: string
    example: '5018.52'
  latest_activity_date:
    type: string
    example: 2025-08-23
  total_count:
    type: integer
    example: 7
  unexplained_transaction_count:
    type: integer
    example: 5
  marked_for_review_count:
    type: integer
    example: 0
  manually_added_transaction_count:
    type: integer
    example: 0
  bank_feed_enabled:
    type: boolean
    example: false
  bank_guess_enabled:
    type: boolean
    example: true
  account_number:
    type: string
    example: '55779911'
  sort_code:
    type: string
    example: 20-00-00
  secondary_sort_code:
    type: string
    example: 20-00-01
  iban:
    type: string
    example: GB33BUKB20201555555555
  bic:
    type: string
    example: BUKBGB22
  email:
    type: string
    example: paypal@example.com
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T06:48:35Z'
  updated_at:
    type: string
    format: date-time
    example: '2026-09-20T09:30:32Z'
