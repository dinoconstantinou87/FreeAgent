type: object
properties:
  contact:
    type: string
    example: https://api.freeagent.com/v2/contacts/1
  reference:
    type: string
    example: REF100
  dated_on:
    type: string
    example: '2026-10-02'
  due_on:
    type: string
    example: '2026-10-30'
  comments:
    type: string
    description: An empty string removes the comments
    example: Annual hosting
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  recurring:
    $ref: '#/components/schemas/BillRecurringPeriod'
  recurring_end_date:
    type: string
    example: 2028-10-02
  bill_items:
    type: array
    description: Every item needs a url - an existing item's to update it, or to remove it with _destroy, and an empty string to add one. Items left out are kept
    items:
      $ref: '#/components/schemas/BillItemPayload'
