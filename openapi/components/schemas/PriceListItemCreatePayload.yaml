type: object
required:
- code
- description
- item_type
properties:
  code:
    type: string
    description: Unique, case-sensitively, and at most 100 characters, or the create is a 422
    example: A001
  description:
    type: string
    example: Apple
  item_type:
    $ref: '#/components/schemas/PriceListItemType'
  quantity:
    type: number
    description: Defaults to 0 - negative only for Hours
    example: 1
  price:
    type: number
    description: Kept at the precision sent - defaults to 0
    example: 1.99
  vat_status:
    $ref: '#/components/schemas/VatStatus'
    description: UK accounts only - defaults to out_of_scope
  sales_tax_rate:
    type: number
    description: Universal and US accounts only
    example: 20
  second_sales_tax_rate:
    type: number
    description: Universal accounts only
    example: 5
  category:
    $ref: '#/components/schemas/ResourceID'
    description: The category, whose ID is its nominal code - defaults to Sales (001), and an unknown code is a 400
  stock_item:
    type: string
    description: For the Stock item type - an unknown stock item is a 500
    example: https://api.freeagent.com/v2/stock_items/1
