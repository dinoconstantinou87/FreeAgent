type: object
required:
- contact
- dated_on
properties:
  contact:
    $ref: '#/components/schemas/ResourceID'
  project:
    $ref: '#/components/schemas/ResourceID'
  dated_on:
    type: string
    example: '2026-10-02'
  payment_terms_in_days:
    type: integer
    description: Defaults to 0. The due date is always dated_on plus this
    example: 30
  reference:
    type: string
    description: Defaults to the next invoice reference
    example: CN-001
  currency:
    $ref: '#/components/schemas/Currency'
    description: The retired codes are refused, and SSP and VES are a 500 that creates nothing
  comments:
    type: string
    example: Refund for cancelled work
