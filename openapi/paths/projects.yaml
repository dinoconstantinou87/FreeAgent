list:
  get:
    tags:
    - Projects
    summary: List projects
    description: List projects - filtered by contact, every status is included
    operationId: listProjects
    parameters:
    - name: contact
      in: query
      description: Filter projects by contact URL - an unknown contact is a 404
      schema:
        type: string
        example: https://api.freeagent.com/v2/contacts/:id
    - $ref: '#/components/parameters/Page'
    - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: Success
        headers:
          Link:
            $ref: '#/components/headers/Link'
          X-Total-Count:
            $ref: '#/components/headers/XTotalCount'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectListResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
show:
  get:
    tags:
    - Projects
    summary: Show project
    description: Show project
    operationId: showProject
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectResponse'
      default:
        $ref: '#/components/responses/ErrorResponse'
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: ''
