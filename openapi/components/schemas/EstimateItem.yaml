type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/estimate_items/1
  position:
    type: integer
    example: 1
  item_type:
    type: string
    example: Hours
  description:
    type: string
    example: Consultancy
  quantity:
    type: string
    example: '2.0'
  price:
    type: string
    example: '95.0'
  category:
    type: string
    example: https://api.freeagent.com/v2/categories/001
  sales_tax_rate:
    type: string
    example: '20.0'
  sales_tax_value:
    type: string
    example: '38.0'
  sales_tax_status:
    type: string
    example: TAXABLE
  second_sales_tax_rate:
    type: string
    example: '0.0'
  second_sales_tax_value:
    type: string
    example: '0.0'
  second_sales_tax_status:
    type: string
    example: TAXABLE
  created_at:
    type: string
    format: date-time
    example: '2026-10-02T09:53:03Z'
  updated_at:
    type: string
    format: date-time
    example: '2026-10-02T09:53:03Z'
