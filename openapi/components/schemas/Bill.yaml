type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/bills/1
  contact:
    type: string
    example: https://api.freeagent.com/v2/contacts/1
  contact_name:
    type: string
    example: Acme Ltd
  reference:
    type: string
    example: BILL-001
  dated_on:
    type: string
    example: 2025-08-23
  due_on:
    type: string
    example: 2025-09-22
  paid_on:
    type: string
    example: 2025-09-01
  status:
    type: string
    example: Open
  long_status:
    type: string
    example: Open
  currency:
    type: string
    example: GBP
  exchange_rate:
    type: string
    example: '1.0'
  net_value:
    type: string
    example: '100.0'
  sales_tax_value:
    type: string
    example: '20.0'
  total_value:
    type: string
    example: '120.0'
  paid_value:
    type: string
    example: '0.0'
  due_value:
    type: string
    example: '120.0'
  native_due_value:
    type: string
    example: '120.0'
  input_total_values_inc_tax:
    type: boolean
    example: false
  is_paid_by_hire_purchase:
    type: boolean
    example: false
  is_locked:
    type: boolean
    example: false
  locked_attributes:
    type: array
    items:
      type: string
    example:
      - total_value
  locked_reason:
    type: string
    example: This bill is locked
  rebill_type:
    type: string
    example: markup
  rebill_factor:
    type: string
    example: '0.25'
  rebill_to_project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  rebilled_on_invoice_item:
    type: string
    example: https://api.freeagent.com/v2/invoice_items/1
  attachment:
    $ref: 'Attachment.yaml'
  bill_items:
    type: array
    items:
      $ref: 'BillItem.yaml'
  created_at:
    type: string
    format: date-time
    example: '2025-08-23T06:48:35Z'
  updated_at:
    type: string
    format: date-time
    example: '2026-09-20T09:30:32Z'
