type: object
required:
  - url
properties:
  url:
    type: string
    example: https://api.freeagent.com/v2/bank_transaction_explanations/1
  type:
    type: string
    example: Payment
  bank_account:
    type: string
    example: https://api.freeagent.com/v2/bank_accounts/1
  bank_transaction:
    type: string
    example: https://api.freeagent.com/v2/bank_transactions/8
  category:
    type: string
    example: https://api.freeagent.com/v2/categories/285
  dated_on:
    type: string
    example: 2010-05-01
  description:
    type: string
    example: harness end-to-end e-business
  detail:
    type: string
    example: Alice Johnson
  transaction_description:
    type: string
    example: Payment from Client ABC Ltd/INV-001/CREDIT
  cheque_number:
    type: string
    example: '001234'
  receipt_reference:
    type: string
    example: REC-001
  gross_value:
    type: string
    example: '-730.0'
  foreign_currency_value:
    type: string
    example: '-850.0'
  transfer_value:
    type: string
    example: '-2340.0'
  ec_status:
    type: string
    example: UK/Non-EC
  place_of_supply:
    type: string
    example: United Kingdom
  sales_tax_rate:
    type: string
    example: '0.0'
  sales_tax_value:
    type: string
    example: '0.0'
  sales_tax_status:
    type: string
    example: TAXABLE
  second_sales_tax_rate:
    type: string
    example: '0.0'
  second_sales_tax_value:
    type: string
    example: '0.0'
  second_sales_tax_status:
    type: string
    example: TAXABLE
  manual_sales_tax_amount:
    type: string
    example: '0.0'
  attachments:
    type: array
    items:
      $ref: 'Attachment.yaml'
  paid_bill:
    type: string
    example: https://api.freeagent.com/v2/bills/123
  paid_invoice:
    type: string
    example: https://api.freeagent.com/v2/invoices/123
  paid_user:
    type: string
    example: https://api.freeagent.com/v2/users/1
  project:
    type: string
    example: https://api.freeagent.com/v2/projects/1
  property:
    type: string
    example: https://api.freeagent.com/v2/properties/1
  direct_contact:
    type: string
    example: https://api.freeagent.com/v2/contacts/1
  rebill_type:
    type: string
    example: markup
  rebill_factor:
    type: string
    example: '0.25'
  transfer_bank_account:
    type: string
    example: https://api.freeagent.com/v2/bank_accounts/2
  linked_transfer_explanation:
    type: string
    example: https://api.freeagent.com/v2/bank_transaction_explanations/2
  linked_transfer_account:
    type: string
    example: https://api.freeagent.com/v2/bank_accounts/2
  stock_item:
    type: string
    example: https://api.freeagent.com/v2/stock_items/1
  capital_asset:
    type: string
    example: https://api.freeagent.com/v2/capital_assets/1
  disposed_asset:
    type: string
    example: https://api.freeagent.com/v2/capital_assets/2
  asset_life_years:
    type: string
    example: '3'
  marked_for_review:
    type: boolean
    example: false
  is_money_in:
    type: boolean
    example: false
  is_money_out:
    type: boolean
    example: true
  is_money_paid_to_user:
    type: boolean
    example: false
  is_deletable:
    type: boolean
    example: true
  has_pending_operation:
    type: boolean
    example: false
  is_locked:
    type: boolean
    example: false
  locked_attributes:
    type: array
    items:
      type: string
    example:
      - gross_value
  locked_reason:
    type: string
    example: This explanation is locked
  updated_at:
    type: string
    format: date-time
